<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920, initial-scale=1.0" />
  <title>Он взломал Монополию McDonald’s</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #0b0d12;
    }
    canvas#scene {
      display: block;
      width: 1080px;
      height: 1920px;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "/node_modules/three/build/three.module.js",
      "three/addons/": "/node_modules/three/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="scene" width="1080" height="1920"></canvas>
  <script type="module">
    import * as THREE from 'three';
    import { buildWorld } from './main.js';
    import { STORY, applyFrame } from './story.js';
    import { createToonInkPipeline } from './toon.js';

    const canvas = document.getElementById('scene');
    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: false,
      preserveDrawingBuffer: true,
      powerPreference: 'high-performance',
    });
    renderer.setSize(STORY.width, STORY.height, false);
    renderer.setPixelRatio(1);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(42, STORY.width / STORY.height, 0.08, 250);
    const world = buildWorld(scene, renderer);
    const inkPipeline = createToonInkPipeline(renderer, scene, camera, STORY.width, STORY.height);

    window.__meta = {
      totalFrames: STORY.totalFrames,
      fps: STORY.fps,
      width: STORY.width,
      height: STORY.height,
    };

    window.__setFrame = async function (frameIndex) {
      const grade = applyFrame(frameIndex, camera, world);
      inkPipeline.render(grade);
      const gl = renderer.getContext();
      if (gl) gl.finish();
      await new Promise((r) => requestAnimationFrame(r));
    };

    const params = new URLSearchParams(window.location.search);
    if (!params.has('render')) {
      let f = 0;
      function loop() {
        const grade = applyFrame(f % STORY.totalFrames, camera, world);
        inkPipeline.render(grade);
        f++;
        requestAnimationFrame(loop);
      }
      loop();
    } else {
      await window.__setFrame(0);
      window.__ready = true;
    }
  </script>
</body>
</html>
